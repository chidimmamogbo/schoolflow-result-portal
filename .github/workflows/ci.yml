# CI: every check that must pass before code reaches main (BUILD_PROMPT Phase 4 step 5).
# Lint, format check, type check, tests, secret scan and dependency audit,
# for the backend and the frontend. Playwright joins in Phase 8.
# Pushes to the staging branch then deploy to staging (last job).
#
# Actions are pinned to a full commit SHA (the tag is in the comment), so a
# changed tag upstream can never swap in different code. Versions checked 2026-10-11.

name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default: CI never needs to change the repo.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every commit in the push or PR is scanned
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # same as the local pre-commit hook
          GITLEAKS_ENABLE_COMMENTS: false # keeps the token read-only

  repo-checks:
    name: Repo checks (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.16
      # Same hooks as on your machine. gitleaks is skipped here because the
      # secrets job above scans full history, which the commit hook cannot.
      - run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  backend:
    name: Backend (Ruff, Pyright, pytest, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.16
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory above
      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command

  backend-image:
    name: Backend image (Docker build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the exact image Vercel will run (D-117), then checks it answers.
      - run: docker build -f Dockerfile.vercel -t schoolflow-api:ci .
      - run: docker run -d --name api -p 8000:8000 schoolflow-api:ci
      - name: Health check answers 200 with {"status":"ok"}
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS http://localhost:8000/api/v1/health) && break
            sleep 1
          done
          echo "$body"
          test "$body" = '{"status":"ok"}'
      - name: Container runs as a non-root user
        run: test "$(docker exec api id -u)" != "0"
      - if: failure()
        run: docker logs api

  frontend:
    name: Frontend (Prettier, ESLint, tsc, Vitest, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # Node 24 is the runtime (D-107); Bun only installs and runs scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json # reads "packageManager": "bun@1.4.2"
      # --frozen-lockfile fails if bun.lock does not match package.json.
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run audit # ignores one unpatched dev-only advisory, see D-130

  # Deploys only after every check above has passed, and only for pushes to the
  # staging branch (D-123). Vercel builds from the uploaded source (the same build
  # as its Git integration), then the deployment gets the staging address.
  # Migrations join here once the database exists (Phase 7).
  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [secrets, repo-checks, backend, backend-image, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets live in the GitHub "staging" environment, which only the staging
    # branch may use, so no other branch or pull request can read the token.
    environment:
      name: staging
      url: https://staging.schoolflow.meritiaa.com
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_DOMAIN: staging.schoolflow.meritiaa.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Stops with a clear message if a secret was saved empty (it happened once).
      - name: Check the deploy secrets are set
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret in the GitHub staging environment is empty"
              exit 1
            fi
          done
      - run: npm install --global vercel@63.1.0 # same CLI version as on your machine
      - name: Deploy (preview target) and capture its URL
        run: |
          url=$(vercel deploy --yes --target=preview --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
      - name: Point the staging address at this deployment
        # --scope names the team, so the project-only token is not asked to
        # look up the user account (that failed with "User not found").
        run: vercel alias set "$DEPLOY_URL" "$STAGING_DOMAIN" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Staging health check answers {"status":"ok"}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "https://$STAGING_DOMAIN/api/v1/health") && break
            sleep 2
          done
          echo "$body"
          test "$body" = '{"status":"ok"}'
