<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My class, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden">
<dc-import name="MyClass" variant="Secondary form teacher" device="Phone" theme="{{theme}}" state="{{state}}" tab="{{tab}}" sections="{{sections}}" role="{{role}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"state":{"editor":"enum","options":["Default","Empty","Loading","Error"],"default":"Default"},"tab":{"editor":"enum","options":["Broadsheet","Students","Preview"],"default":"Broadsheet"},"sections":{"editor":"enum","options":["Open","Submitted","Returned"],"default":"Open"},"role":{"editor":"enum","options":["Teacher","Assistant"],"default":"Teacher"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { const p = this.props; return { theme: p.theme ?? 'Light', state: p.state ?? 'Default', tab: p.tab ?? 'Broadsheet', sections: p.sections ?? 'Open', role: p.role ?? 'Teacher' }; }
}
</script>
</body>
</html>
