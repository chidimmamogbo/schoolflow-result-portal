<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assessment structure, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden">
<dc-import name="Assessment"  device="Phone" theme="{{theme}}" state="{{state}}" school="{{school}}" locked="{{locked}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"state":{"editor":"enum","options":["Default","Empty","Loading","Error"],"default":"Default"},"school":{"editor":"enum","options":["Greenfield Model College","Bright Stars Academy"],"default":"Greenfield Model College"},"locked":{"editor":"enum","options":["Editable","Locked for this term"],"default":"Editable"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'Light', state: this.props.state ?? 'Default', school: this.props.school ?? 'Greenfield Model College', locked: this.props.locked ?? 'Editable' }; }
}
</script>
</body>
</html>
