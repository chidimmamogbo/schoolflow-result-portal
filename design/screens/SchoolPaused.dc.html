<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>School access paused</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="sf" data-theme="{{theme}}" data-device="{{device}}" style="min-height: {{minH}}; height: {{fixH}}; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 24px">
  <img src="{{logo}}" alt="SchoolFlow Result Portal" style="width: 170px; height: auto">
  <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
    <div class="card col" aria-busy="true" style="width: 100%; max-width: 460px; align-items: center; gap: 14px; padding: 32px">
      <div class="skel" style="width: 56px; height: 56px; border-radius: 9999px"></div>
      <div class="skel" style="width: 70%; height: 22px"></div>
      <div class="skel" style="width: 90%; height: 16px"></div>
    </div>
  </sc-if>
  <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
    <div class="card state" role="alert" style="width: 100%; max-width: 460px">
      <span class="ic" style="background: var(--danger-soft); color: var(--danger)"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 8v4M12 16h.01"></path></svg></span>
      <p class="h3">We couldn't load this page.</p>
      <p class="muted">Check your connection and try again.</p>
      <button class="btn primary">Try again</button>
    </div>
  </sc-if>
  <sc-if value="{{isMain}}" hint-placeholder-val="{{ true }}">
    <div class="card state" role="status" style="width: 100%; max-width: 460px; gap: 16px">
      <div class="row" style="justify-content: center; gap: 10px">
        <span class="crest" aria-hidden="true">GMC</span>
        <span style="font-size: 16px; font-weight: 700">Greenfield Model College</span>
      </div>
      <span class="badge b-danger"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>Suspended</span>
      <h1 style="font-size: 22px; line-height: 30px; font-weight: 700">Your school's access is paused. Contact your school admin.</h1>
      <a class="btn" href="{{loginHref}}">Log out</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"state":{"editor":"enum","options":["Default","Empty","Loading","Error"],"default":"Default"},"device":{"editor":"enum","options":["Desktop","Phone"],"default":"Desktop"},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const theme = String(P.theme || 'Light').toLowerCase();
    const device = String(P.device || 'Desktop').toLowerCase();
    const st = String(P.state || 'Default').toLowerCase();
    const phone = device === 'phone';
    return {
      theme, device,
      minH: phone ? '844px' : '100vh', fixH: phone ? '844px' : 'auto',
      logo: theme === 'dark' ? '/_blob/f8c668b157c01655c625f83bed0c84c2' : '/_blob/182db0c32744c4f6abeb340d16b2ccfb',
      isLoading: st === 'loading', isError: st === 'error', isMain: st === 'default' || st === 'empty',
      loginHref: phone ? 'Login_Phone.dc.html' : 'Login.dc.html'
    };
  }
}
</script>
</body>
</html>
