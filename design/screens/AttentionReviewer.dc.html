<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Students needing attention, reviewer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%">
<dc-import name="Attention" role="Reviewer" theme="{{theme}}" state="{{state}}" device="{{device}}" school="{{school}}" hint-size="1440px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"state":{"editor":"enum","options":["Default","Empty","Loading","Error","Before publication"],"default":"Default"},"device":{"editor":"enum","options":["Desktop","Phone"],"default":"Desktop"},"school":{"editor":"enum","options":["Greenfield Model College","Bright Stars Academy"],"default":"Greenfield Model College"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'Light', state: this.props.state ?? 'Default', device: this.props.device ?? 'Desktop', school: this.props.school ?? 'Greenfield Model College' }; }
}
</script>
</body>
</html>
