<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in to SchoolFlow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f4fd8}a:hover{color:#163ca8}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #1f4fd8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f8fa; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 28px">
  <img src="/_blob/182db0c32744c4f6abeb340d16b2ccfb" alt="SchoolFlow Result Portal" style="width: 196px; height: auto; align-self: flex-start">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em">Welcome back</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #5b6475">Log in with the details your school gave you.</p>
  </div>

  <div style="background: #ffffff; border: 1px solid #e3e7ee; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,0.06); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <div role="tablist" aria-label="Login method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #f1f3f7; border-radius: 10px; padding: 4px">
        <button role="tab" aria-selected="true" onClick="{{pickEmail}}" style="height: 40px; border: 0; border-radius: 8px; background: #ffffff; color: #0f172a; font: 600 14px Inter, system-ui, sans-serif; box-shadow: 0 1px 2px rgba(15,23,42,0.08); cursor: pointer">Email</button>
        <button role="tab" aria-selected="false" onClick="{{pickStudent}}" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #5b6475; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer">Student</button>
      </div>
    </sc-if>
    <sc-if value="{{isStudent}}" hint-placeholder-val="{{ false }}">
      <div role="tablist" aria-label="Login method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #f1f3f7; border-radius: 10px; padding: 4px">
        <button role="tab" aria-selected="false" onClick="{{pickEmail}}" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #5b6475; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer">Email</button>
        <button role="tab" aria-selected="true" onClick="{{pickStudent}}" style="height: 40px; border: 0; border-radius: 8px; background: #ffffff; color: #0f172a; font: 600 14px Inter, system-ui, sans-serif; box-shadow: 0 1px 2px rgba(15,23,42,0.08); cursor: pointer">Student</button>
      </div>
    </sc-if>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Email address
          <input type="email" value="tunde.adebayo@greenfield.edu.ng" style="height: 48px; box-sizing: border-box; border: 1px solid #737c8f; border-radius: 8px; padding: 0 12px; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; background: #ffffff">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Password
          <input type="password" value="password123" style="height: 48px; box-sizing: border-box; border: 1px solid #737c8f; border-radius: 8px; padding: 0 12px; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; background: #ffffff">
        </label>
      </div>
    </sc-if>
    <sc-if value="{{isStudent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">School code
          <input type="text" value="GMC" style="height: 48px; box-sizing: border-box; border: 1px solid #737c8f; border-radius: 8px; padding: 0 12px; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; background: #ffffff">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Admission number
          <input type="text" value="GMC/2026/014" style="height: 48px; box-sizing: border-box; border: 1px solid #737c8f; border-radius: 8px; padding: 0 12px; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; background: #ffffff">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Password
          <input type="password" value="password123" style="height: 48px; box-sizing: border-box; border: 1px solid #737c8f; border-radius: 8px; padding: 0 12px; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; background: #ffffff">
        </label>
      </div>
    </sc-if>

    <a href="TeacherSheets.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; background: #1f4fd8; color: #ffffff; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none">Log in</a>
    <a href="#forgot" style="align-self: center; font-size: 14px; font-weight: 500">Forgot password?</a>
  </div>

  <div style="display: flex; gap: 12px; align-items: center; background: #ffffff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 14px 16px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 600">Checking a report card?</span>
      <a href="Verify.dc.html" style="font-size: 14px; font-weight: 500">Verify a report without logging in</a>
    </div>
  </div>

  <p style="margin: auto 0 0; font-size: 14px; line-height: 20px; color: #5b6475; text-align: center">There is no sign-up. Your school creates your account and sends you a link.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'email' }; }
  renderVals() {
    const isEmail = this.state.tab === 'email';
    return {
      isEmail, isStudent: !isEmail,
      pickEmail: () => this.setState({ tab: 'email' }),
      pickStudent: () => this.setState({ tab: 'student' })
    };
  }
}
</script>
</body>
</html>
