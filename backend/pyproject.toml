[project]
name = "schoolflow-api"
version = "0.1.0"
description = "SchoolFlow Result Portal API (FastAPI)"
authors = [
    { name = "Chidimma Mogbo", email = "288715556+chidimmamogbo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.170.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any warning fails the run, so deprecations are fixed when they appear.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W style, F real mistakes, I import order, B likely bugs, UP modern syntax,
# S security (Bandit rules), N naming, SIM simpler code, RUF Ruff's own checks.
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain `assert`, which is how pytest checks results.
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


# Alembic migrations (D-023). Generated with `alembic init --template pyproject`
# (Alembic 1.20.0, 2026-10-12), then trimmed. Logging settings are in alembic.ini.
[tool.alembic]
script_location = "%(here)s/migrations"
# File names start with the date, so migrations list in the order they were made.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# New migration files are formatted and lint-fixed by Ruff as they are written.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
