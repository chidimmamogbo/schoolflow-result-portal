<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
<tr><td style="padding:24px;font-size:16px;line-height:1.5;">
{% for paragraph in content.paragraphs %}
<p style="margin:0 0 16px;">{{ paragraph }}</p>
{% endfor %}
{% if content.button %}
<p style="margin:24px 0;"><a href="{{ content.button[1] }}" style="display:inline-block;padding:12px 20px;background:#1F4E79;color:#ffffff;text-decoration:none;border-radius:6px;">{{ content.button[0] }}</a></p>
<p style="margin:0 0 16px;font-size:13px;color:#555555;">Or copy this address: {{ content.button[1] }}</p>
{% endif %}
<p style="margin:24px 0 0;font-size:13px;color:#555555;">Sent by SchoolFlow.</p>
</td></tr>
</table>
</body>
</html>
