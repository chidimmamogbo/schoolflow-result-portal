<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt {{ receipt.receipt_number }}</title>
<style>
  @page { size: A4; margin: 24mm; }
  body { font-family: Inter, "DejaVu Sans", sans-serif; color: #1a1a1a; background: #ffffff; font-size: 12pt; }
  h1 { font-size: 20pt; margin: 0 0 4mm; }
  .school { font-size: 13pt; margin: 0 0 10mm; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 3mm 0; border-bottom: 0.3mm solid #d8d8d8; font-weight: normal; }
  th { color: #555555; width: 45%; }
  .total td { font-weight: bold; font-size: 14pt; }
  .foot { margin-top: 10mm; color: #555555; font-size: 10pt; }
</style>
</head>
<body>
  <h1>Receipt {{ receipt.receipt_number }}</h1>
  <p class="school">{{ receipt.school_name }}</p>
  <table>
    <tr><th>Term</th><td>{{ receipt.term }}</td></tr>
    <tr><th>Plan</th><td>{{ receipt.plan }}</td></tr>
    <tr><th>Billable students</th><td>{{ receipt.billable_students }}</td></tr>
    <tr><th>Paid on</th><td>{{ paid_on }}</td></tr>
    <tr><th>Reference</th><td>{{ receipt.reference }}</td></tr>
    <tr class="total"><th>Amount paid</th><td>{{ amount }}</td></tr>
  </table>
  <p class="foot">Issued by SchoolFlow.</p>
</body>
</html>
